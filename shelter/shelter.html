    <title>Shelter</title>
</head>

    <main class="main">
    <section class="start-screen">
        <div class="start-screen__wrapper">
            <div class="start-screen__content"></div>
             <div class="start-screen__puppy"></div>
        </div>
    </section>
    <section class="about">
        <div class="about__wrapper">
            <div class="about__pets"></div>
            <div class="about__description"></div>
        </div>
    </section>
    <section class="pets">
        <div class="pets__wrapper">
            <div class="pets__title"></div>
            <div class="pets__slider"></div>
            <div class="pets__button"></div>
        </div>
    </section>
    <section class="help">
        <div class="help__wrapper">
            <div class="help__title"></div>
            <div class="help__list"></div>
        </div>
    </section>

    <section class="donation">
        <div class="donation__wrapper">
            <div class="donation__dog"></div>
            <div class="donation__desicription"></div>
        </div>
    </section>

    <footer class="footer">
        <div class="footer__wrapper">
            <div class="footer__contacts">
                <h3 class="footer__contacts-title">For questions and suggestions</h3>
                <div class="footer__contacts-mail">
                    <img src="./assets/svg/icon-email.svg" alt="email-logo" class="mail__icon">
                    <span class="mail__description">email@shelter.com</span>
                </div>
                <div class="footer__contacts-phone">
                    <img src="./assets/svg/icon-phone.svg" alt="phone-logo" class="phone__icon">
                    <span class="phone__description">+13 674 567 75 54</span>
                </div>
            </div>
            <div class="footer__location">
                <h3 class="footer__location-title">We are waiting for your visit</h3>
                <div class="footer__location-Boston">
                    <img src="./assets/svg/icon-marker.svg" alt="marker-logo" class="boston__marker">
                    <p class="boston__description">1 Central Street, Boston (entrace from the store)</p>
                </div>
                <div class="footer__location-London">
                    <img src="./assets/svg/icon-marker.svg" alt="marker-logo" class="boston__marker">
                    <p class="london__description">18 South Park, London</p>
                </div>
            </div>
            <div class="footer__logo">
                <img src="./assets/img/footer-puppy.png" alt="puppy-logo" class="footer__puppy">
            </div>
        </div>
    </footer>











    </main>

</body>
