<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./css/pets.css">
    <title>Pets</title>
</head>
<body>
<header class="header">
    <div class="header__wrapper">
        <div class="header__logo">
            <span class="header__title">Cozy House</span>
            <span class="header__subtitle">Shelter for pets in Boston</span>
        </div>
        <nav class="menu">
            <ul class="menu-list">
                <li class="menu__item">About the shelter</li>
                <li class="menu__item menu__item_active">Out pets</li>
                <li class="menu__item">Help the shelter</li>
                <li class="menu__item">Contacts</li>
            </ul>
        </nav>
    </div>
</header>
<main class="Our_Friends">
    <section class="Our_Friends__wrapper">
        <div class="Our_Friends__title">
            <h3 class="Our_Friends__title-description">Our friends who <br>are looking for a house</h3>
        </div>
        <div class="Our_Friends__container">
            <div class="pets__card card__katrine">
                <img src="..//pets/assets/img/pets-katrine.png" alt="katrine-logo" class="pets__logo">
            <span class="pets__name">Katrine</span>
            <button class="pets__button">Learn more</button>
            </div>
            <div class="pets__card card__jennifer">
                <img src="..//pets/assets/img/pets-jennifer.png" alt="jennifer-logo" class="pets__logo">
            <span class="pets__name">Jennifer</span>
            <button class="pets__button">Learn more</button>
            </div>
            <div class="pets__card card__woody">
                <img src="..//pets/assets/img/pets-woody.png" alt="woody-logo" class="pets__logo">
            <span class="pets__name">Woody</span>
            <button class="pets__button">Learn more</button>
            </div>
            <div class="pets__card card__sophia">
                <img src="..//pets/assets/img/sophia.png" alt="sophia-logo" class="pets__logo">
            <span class="pets__name">Sophia</span>
            <button class="pets__button">Learn more</button>
            </div>
            <div class="pets__card card__timmy">
                <img src="..//pets/assets/img/pets-timmy.png" alt="timmy-logo" class="pets__logo">
            <span class="pets__name">Timmy</span>
            <button class="pets__button">Learn more</button>
            </div>
            <div class="pets__card card__charly">
                <img src="..//pets/assets/img/pets-charly.png" alt="charly-logo" class="pets__logo">
            <span class="pets__name">Charly</span>
            <button class="pets__button">Learn more</button>
            </div>
            <div class="pets__card card__scarlett">
                <img src="..//pets/assets/img/pets-scarlet.png" alt="scarlett-logo" class="pets__logo">
            <span class="pets__name">Scarlett</span>
            <button class="pets__button">Learn more</button>
            </div>
            <div class="pets__card card__freddie">
                <img src="..//pets/assets/img/freddie.png" alt="freddie-logo" class="pets__logo">
            <span class="pets__name">Freddie</span>
            <button class="pets__button">Learn more</button>
            </div>
        </div>
    </section>
    <div class="Our_Friends__pagination">
        <img class="arrow__left_double" src="./assets/svg/dl.svg">
        <img class="arrow__left" src="./assets/svg/l.svg">
        <img class="page__pagination" src="./assets/svg/1.svg">
        <img class="arrow__right" src="./assets/svg/r.svg">
        <img class="arrow__right_double" src="./assets/svg/dr.svg">
    </div>
</main>
<footer class="footer">
    <div class="footer__wrapper">
        <div class="footer__contacts">
            <div class="footer__contacts-title"></div>
            <div class="footer__contacts-mail"></div>
            <div class="footer__contacts-phone"></div>
        </div>
        <div class="footer__location">
            <div class="footer__location-Boston"></div>
            <div class="footer__location-London"></div>
        </div>
        <div class="footer__logo"></div>
    </div>
</footer>
</body>
</html>
